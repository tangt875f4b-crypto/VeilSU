# VeilSU CI — GitHub-native replacement for the upstream Forgejo pipeline.
#
# Upstream SukiSU Nova ran on a self-hosted Forgejo (git.zako.shirkneko.top,
# FORGEJO_TOKEN, /ci/* host paths, Forgejo releases + Telegram). None of that
# exists for this fork, so this file is the whole pipeline:
#   generate-key (PRs) -> version -> build-lkm (8 KMIs, DDK containers)
#     -> build-ksuinit -> build-ksud -> build-manager -> repack-manager
#     -> publish-ci (rolling `manager-ci` pre-release, feeds the in-app CI updater)
#     -> release (on v* tags, GitHub Release with VeilSU_* APKs + .ko files)
#
# Secrets the repo needs (Settings -> Secrets and variables -> Actions):
#   KEYSTORE            base64 of veilsu-release.keystore (PKCS12, alias veilsu)
#   KEY_ALIAS           veilsu
#   KEYSTORE_PASSWORD   store password
#   KEY_PASSWORD        key password
# The keystore itself is NOT in this repo. Losing it means installed VeilSU
# can never be updated in place.
#
# Public trust values (also the defaults in kernel/Kbuild):
#   package me.veilsu.manager (me.veilsu.manager.pr on PRs)
#   KSU_EXPECTED_SIZE 0x52b, KSU_EXPECTED_HASH 0d5290a9e22b837f...
#
# NOT verified without a push: DDK container KDIR layout, NDK/SDK availability
# on ubuntu-latest, Gradle 9.7.1 + AGP 9.4.1 build, repack_apk.py on the new
# package name. First run should be watched end-to-end (see README in docs/).

name: VeilSU CI

on:
  push:
    branches: ["main", "veilsu-v1"]
    tags: ["v*"]
    paths:
      - ".github/workflows/veilsu.yml"
      - "manager/**"
      - "kernel/**"
      - "userspace/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "repack_apk.py"
      - "split_apk_by_arch.py"
  pull_request:
    branches: ["main", "veilsu-v1"]
    paths:
      - ".github/workflows/veilsu.yml"
      - "manager/**"
      - "kernel/**"
      - "userspace/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "repack_apk.py"
      - "split_apk_by_arch.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  VEILSU_PACKAGE: me.veilsu.manager
  VEILSU_PACKAGE_PR: me.veilsu.manager.pr
  VEILSU_EXPECTED_SIZE: 0x52b
  VEILSU_EXPECTED_HASH: 58d0307d7f5e1d444101ccb9b192168e1c76acd571cf7d9a7343bfb0f8658585
  KPM_TOOLS_BASE_URL: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.14.0

jobs:
  # PRs are signed with a throwaway key so a PR can never produce an APK that
  # looks like a release build. Push builds use the production keystore secrets.
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          set -eux
          KEYSTORE_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | head -c 20)
          KEY_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | head -c 20)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=VeilSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks
          echo "keystore=$(base64 -w 0 pr-key.jks)" >> "$GITHUB_OUTPUT"
      - name: Extract certificate hash and size
        if: github.event_name == 'pull_request'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          set -eux
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der
          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> "$GITHUB_OUTPUT"
          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate version
        id: version
        run: |
          set -eux
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((10000 + COMMIT_COUNT + 996))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          VERSION_NAME=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v1.0.0")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VeilSU version: $VERSION_NAME ($VERSION_CODE)"

  build-lkm:
    needs: [generate-key, determine-version]
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    env:
      KMI: ${{ matrix.kmi }}
      PACKAGE_NAME: ${{ github.event_name == 'pull_request' && 'me.veilsu.manager.pr' || 'me.veilsu.manager' }}
      EXPECTED_SIZE: ${{ needs.generate-key.outputs.expected_size || '0x52b' }}
      EXPECTED_HASH: ${{ needs.generate-key.outputs.expected_hash || '58d0307d7f5e1d444101ccb9b192168e1c76acd571cf7d9a7343bfb0f8658585' }}
      KSU_VERSION_CODE: ${{ needs.determine-version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build kernelsu.ko (aarch64)
        run: |
          set -eux
          # The DDK image ships a prepared aarch64 kdir; fall back to preparing
          # one from the bundled source tarball (same as the x86_64 step below).
          if [ -d "/opt/ddk/kdir/${KMI}" ]; then
            export KDIR="/opt/ddk/kdir/${KMI}"
          else
            mkdir -p "/opt/ddk/kdir/${KMI}"
            export KDIR="/opt/ddk/kdir/${KMI}"
            pushd "/opt/ddk/src/${KMI}"
            make O="$KDIR" gki_defconfig
            make O="$KDIR" modules_prepare
            make O="$KDIR" security/selinux/built-in.a
            popd
          fi
          cd kernel
          set -- CONFIG_KSU=m CONFIG_KPM=y CC=clang
          set -- "$@" "KSU_PACKAGE_NAME=$PACKAGE_NAME"
          set -- "$@" "KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
          set -- "$@" "KSU_EXPECTED_HASH=$EXPECTED_HASH"
          set -- "$@" "KSU_VERSION=$KSU_VERSION_CODE"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then set -- "$@" "KSU_BUILD_REF=release"; fi
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then set -- "$@" "KSU_IS_PR_BUILD=1"; fi
          make -j"$(nproc)" "$@"
          mkdir -p "${GITHUB_WORKSPACE}/out/aarch64"
          cp kernelsu.ko "${GITHUB_WORKSPACE}/out/aarch64/${KMI}_kernelsu.ko"
          llvm-strip -d "${GITHUB_WORKSPACE}/out/aarch64/${KMI}_kernelsu.ko"
      - name: Build kernelsu.ko (x86_64)
        run: |
          set -eux
          cd kernel
          make clean
          mkdir -p /opt/ddk/kdir-x64
          unset ARCH
          unset CROSS_COMPILE
          export ARCH=x86_64
          kmi="$KMI"
          pushd "/opt/ddk/src/${kmi}"
          export KDIR="/opt/ddk/kdir-x64/${kmi}"
          MODPOST=scripts/mod/modpost.c
          sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
          sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
          sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"
          sed -i 's/__version_ext_names\\") =\\n/__version_ext_names\\") = \\"\\"\\n/' "$MODPOST"
          make O="$KDIR" gki_defconfig
          scripts/config --file "$KDIR/.config" -d LTO_CLANG -e LTO_NONE \
            -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
          if [ "$kmi" = "android16-6.12" ] || [ "$kmi" = "android17-6.18" ]; then
            scripts/config --file "$KDIR/.config" -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS
          fi
          make O="$KDIR" modules_prepare
          make O="$KDIR" security/selinux/built-in.a
          popd
          set -- CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y
          set -- "$@" "KSU_PACKAGE_NAME=$PACKAGE_NAME"
          set -- "$@" "KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
          set -- "$@" "KSU_EXPECTED_HASH=$EXPECTED_HASH"
          set -- "$@" "KSU_VERSION=$KSU_VERSION_CODE"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then set -- "$@" "KSU_BUILD_REF=release"; fi
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then set -- "$@" "KSU_IS_PR_BUILD=1"; fi
          MDIR="$(realpath .)"
          if [ "$kmi" = "android17-6.18" ]; then
            make -C "$KDIR" M="$MDIR" MO="$MDIR" compile_commands.json modules "$@"
          else
            make -C "$KDIR" M="$MDIR" src="$MDIR" compile_commands.json modules "$@"
          fi
          mkdir -p "${GITHUB_WORKSPACE}/out/x86_64"
          cp kernelsu.ko "${GITHUB_WORKSPACE}/out/x86_64/${KMI}_kernelsu.ko"
          llvm-strip -d "${GITHUB_WORKSPACE}/out/x86_64/${KMI}_kernelsu.ko"
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-${{ matrix.kmi }}-lkm
          path: out/aarch64/${{ matrix.kmi }}_kernelsu.ko
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-${{ matrix.kmi }}-lkm
          path: out/x86_64/${{ matrix.kmi }}_kernelsu.ko

  build-ksuinit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Set up Rust (nightly for riscv64)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-23
          targets: riscv64-linux-android
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;29.0.14206865" "platforms;android-35" "platforms;android-26"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build ksuinit (aarch64 / armv7 / x86_64)
        run: |
          set -eux
          for spec in "aarch64-linux-android:26:aarch64" "armv7-linux-androideabi:26:arm" "x86_64-linux-android:26:x86_64"; do
            target="${spec%%:*}"; rest="${spec#*:}"; level="${rest%%:*}"; builtin="${rest##*:}"
            source .github/scripts/setup-rust-build.sh "$target" "$level"
            BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-${builtin}-android.a"
            test -f "$BUILTINS"
            export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
            cargo build --package ksuinit --target="$target" --release
          done
      - name: Build ksuinit (riscv64)
        run: |
          set -eux
          source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-riscv64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml \
            -Z build-std=std,panic_abort --target riscv64-linux-android --release \
            --manifest-path ./userspace/ksud/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ksuinit-aarch64
          path: target/aarch64-linux-android/release/ksuinit
      - uses: actions/upload-artifact@v4
        with:
          name: ksuinit-arm
          path: target/armv7-linux-androideabi/release/ksuinit
      - uses: actions/upload-artifact@v4
        with:
          name: ksuinit-x86_64
          path: target/x86_64-linux-android/release/ksuinit
      - uses: actions/upload-artifact@v4
        with:
          name: ksuinit-riscv64
          path: target/riscv64-linux-android/release/ksuinit

  build-ksud:
    needs: [generate-key, build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi, riscv64-linux-android]
    runs-on: ubuntu-latest
    env:
      TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Rust nightly (riscv64)
        if: matrix.target == 'riscv64-linux-android'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-23
          targets: riscv64-linux-android
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;29.0.14206865" "platforms;android-35" "platforms;android-26"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Download LKM + ksuinit artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-lkm"
      - uses: actions/download-artifact@v4
        with:
          name: ksuinit-aarch64
          path: artifacts/ksuinit-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: ksuinit-arm
          path: artifacts/ksuinit-arm
      - uses: actions/download-artifact@v4
        with:
          name: ksuinit-x86_64
          path: artifacts/ksuinit-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: ksuinit-riscv64
          path: artifacts/ksuinit-riscv64
      - name: Pack LKM + ksuinit into ksud
        run: |
          set -eux
          # VeilSU v1 packs NO BuiltZygisk: the built-in Zygisk was removed.
          cp artifacts/aarch64-*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
          cp artifacts/x86_64-*-lkm/*_kernelsu.ko ./userspace/ksud/bin/x86_64/
          mv artifacts/ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
          mv artifacts/ksuinit-arm/ksuinit ./userspace/ksud/bin/arm/
          mv artifacts/ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
          mv artifacts/ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/
          ls -la userspace/ksud/bin/aarch64/ userspace/ksud/bin/x86_64/
      - name: Build ksud
        env:
          KSU_PACKAGE_NAME: ${{ github.event_name == 'pull_request' && 'me.veilsu.manager.pr' || 'me.veilsu.manager' }}
        run: |
          set -eux
          cargo --version
          rustup target list --installed
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ "${{ matrix.target }}" = "riscv64-linux-android" ]; then
            source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
            BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-riscv64-android.a"
            test -f "$BUILTINS"
            cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml \
              -Z build-std=std,panic_abort --target "$TRIPLE" --release \
              --manifest-path ./userspace/ksud/Cargo.toml
          else
            source .github/scripts/setup-rust-build.sh "${{ matrix.target }}" 26
            cargo build --target "$TRIPLE" --release \
              --manifest-path ./userspace/ksud/Cargo.toml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ksud-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ksud

  build-manager:
    needs: [generate-key, build-ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Download ksud artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "ksud-*"
      - name: Write keystore (release)
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          test -n "${{ vars.KEYSTORE || secrets.KEYSTORE }}"
          echo "${{ vars.KEYSTORE || secrets.KEYSTORE }}" | base64 -d > manager/key.jks
          {
            echo "KEYSTORE_PASSWORD=${{ vars.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ vars.KEY_PASSWORD || secrets.KEY_PASSWORD }}"
            echo "KEYSTORE_FILE=key.jks"
          } >> manager/gradle.properties
      - name: Write keystore (PR)
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          set -eu
          echo "$PR_KEYSTORE" | base64 -d > manager/pr-key.jks
          {
            echo "KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=pr-key"
            echo "KEY_PASSWORD=$PR_KEY_PASSWORD"
            echo "KEYSTORE_FILE=pr-key.jks"
          } >> manager/gradle.properties
      - name: Copy ksud into manager (with per-build identity randomization)
        working-directory: manager
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          ARM64_KSUD=$(find ../artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARM_KSUD=$(find ../artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find ../artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$ARM_KSUD"
          test -n "$X86_64_KSUD"
          # Randomize the packaged identity on every build so detectors cannot
          # pin stable anchors: the daemon/JNI library name and the component
          # class names. Only the copies inside the APK change.
          rand_alpha() {
            openssl rand -base64 48 | tr -dc 'a-z' | cut -c1-"$1"
          }
          KSUD_LIB="lib$(rand_alpha 10).so"
          CORE_LIB="$(rand_alpha 11)"
          APP_CLASS="$(rand_alpha 11)"
          PRELOAD_CLASS="$(rand_alpha 11)"
          MAIN_CLASS="$(rand_alpha 11)"
          WEBUI_CLASS="$(rand_alpha 11)"
          DOWNLOAD_CLASS="$(rand_alpha 11)"
          MAGICA_CLASS="$(rand_alpha 11)"
          find app/src/main -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \
               -o -name '*.cc' -o -name 'CMakeLists.txt' \) \
            -exec sed -i \
              -e "s/\"libksud\.so\"/\"$KSUD_LIB\"/g" \
              -e "s/project(\"kernelsu\")/project(\"$CORE_LIB\")/" \
              -e "s/add_library(kernelsu/add_library($CORE_LIB/" \
              -e "s/target_include_directories(kernelsu /target_include_directories($CORE_LIB /" \
              -e "s/target_link_libraries(kernelsu /target_link_libraries($CORE_LIB /" \
              -e "s/loadLibrary(\"kernelsu\")/loadLibrary(\"$CORE_LIB\")/g" \
              -e "/^[[:space:]]*[*\/]/!s/KernelSUApplication/${APP_CLASS}Application/g" \
              -e "/^[[:space:]]*[*\/]/!s/AppZygotePreload/${PRELOAD_CLASS}Preload/g" \
              -e "/^[[:space:]]*[*\/]/!s/MainActivity/${MAIN_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/WebUIActivity/${WEBUI_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/DownloadService/${DOWNLOAD_CLASS}Service/g" \
              -e "/^[[:space:]]*[*\/]/!s/MagicaService/${MAGICA_CLASS}Service/g" \
              {} +
          find app/src/main -depth -type f -name 'KernelSUApplication.kt' \
            -execdir mv {} "${APP_CLASS}Application.kt" \;
          find app/src/main -depth -type f -name 'AppZygotePreload.java' \
            -execdir mv {} "${PRELOAD_CLASS}Preload.java" \;
          find app/src/main -depth -type f -name 'MainActivity.kt' \
            -execdir mv {} "${MAIN_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'MainActivityUiState.kt' \
            -execdir mv {} "${MAIN_CLASS}ActivityUiState.kt" \;
          find app/src/main -depth -type f -name 'MainActivityViewModel.kt' \
            -execdir mv {} "${MAIN_CLASS}ActivityViewModel.kt" \;
          find app/src/main -depth -type f -name 'WebUIActivity.kt' \
            -execdir mv {} "${WEBUI_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'DownloadService.kt' \
            -execdir mv {} "${DOWNLOAD_CLASS}Service.kt" \;
          find app/src/main -depth -type f -name 'MagicaService.java' \
            -execdir mv {} "${MAGICA_CLASS}Service.java" \;
          echo "Packaged identity: $KSUD_LIB, lib$CORE_LIB.so, ${APP_CLASS}Application, ${PRELOAD_CLASS}Preload"
          cp -f "$ARM64_KSUD" "app/src/main/jniLibs/arm64-v8a/$KSUD_LIB"
          cp -f "$ARM_KSUD" "app/src/main/jniLibs/armeabi-v7a/$KSUD_LIB"
          cp -f "$X86_64_KSUD" "app/src/main/jniLibs/x86_64/$KSUD_LIB"
      - name: Build with Gradle
        working-directory: manager
        env:
          KPM_TOOLS_BASE_URL: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.14.0
        run: |
          set -eux
          ./gradlew --build-cache -Dorg.gradle.parallel=true \
            assembleRelease ${{ github.event_name == 'pull_request' && '-PIS_PR_BUILD=true' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('manager/app/build/outputs/mapping/release/**') != ''
        with:
          name: Manager-mappings
          path: manager/app/build/outputs/mapping/release/

  repack-manager:
    needs: [generate-key, build-manager, build-ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "Manager-gradle"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "ksud-*"
      - name: Place APK + ksud
        id: place
        run: |
          set -e
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/Manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "APK_STEM=$(basename "$APK" .apk)" >> "$GITHUB_OUTPUT"
          cp -f "$APK" manager/app/build/outputs/apk/release/
          for t in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android riscv64-linux-android; do
            mkdir -p "target/$t/release"
            cp -f "$(find artifacts/ksud-$t -type f -name ksud | head -n 1)" "target/$t/release/ksud"
          done
      - name: Prepare signing inputs
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ vars.KEYSTORE || secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ vars.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ vars.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "$PR_KEYSTORE" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            echo "SIGN_KEYSTORE_FILE=pr-key.jks" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=pr-key" >> "$GITHUB_ENV"
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            test -n "$PROD_KEYSTORE"
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            echo "SIGN_KEYSTORE_FILE=key.jks" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Repack and resign
        run: |
          set -eu
          OUTPUT_NAME="${{ steps.place.outputs.APK_STEM }}"
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -a riscv64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip \
            --output-name "$OUTPUT_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: Manager
          path: dist/*.apk

  # Rolling pre-release for the in-app CI updater (Downloader.kt checks the
  # `manager-ci` tag). Only on pushes to the main branches, never on PRs/tags.
  publish-ci:
    needs: [repack-manager, determine-version]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Manager
          path: dist
      - name: Publish manager-ci pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-ci
          name: "VeilSU CI (${{ needs.determine-version.outputs.version_code }})"
          prerelease: true
          make_latest: false
          files: dist/*.apk

  release:
    needs: [repack-manager, build-lkm, determine-version]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Manager
          path: dist
      - uses: actions/download-artifact@v4
        with:
          path: lkm
          pattern: "*-lkm"
      - name: Rename .ko files
        run: |
          set -eux
          mkdir -p release-files
          cp dist/*.apk release-files/
          for f in lkm/*/*.ko; do
            base=$(basename "$f")
            cp "$f" "release-files/VeilSU_${base}"
          done
          ls -la release-files/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "VeilSU ${{ github.ref_name }}"
          files: release-files/*
          body: |
            VeilSU ${{ github.ref_name }} (version code ${{ needs.determine-version.outputs.version_code }})
            Forked from SukiSU Nova. Minimal v1: modules + su only, no Zygisk.
